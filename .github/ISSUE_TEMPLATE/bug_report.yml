name: Bug report
description: Report a reproducible plugin problem. Do not report vulnerabilities here.
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities privately using SECURITY.md.
        Use synthetic PDFs and sanitised logs, never confidential documents.
  - type: textarea
    id: versions
    attributes:
      label: Environment and versions
      description: Operating system, Python, Repowise, plugin and MarkItDown versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands, minimal example and sanitised repowise plugins output.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
