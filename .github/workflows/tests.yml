name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.workflow }}-${{ github.ref }}-${{ matrix.python }}
      cancel-in-progress: false
    strategy:
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --group dev --python ${{ matrix.python }}
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build
      - run: uv run python scripts/validate_release.py --dist dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions-python-${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 14
