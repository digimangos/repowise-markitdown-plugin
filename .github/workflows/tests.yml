name: Tests

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  latest-repowise:
    name: Synthetic integration with latest Repowise (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: repowise-dev/repowise
          ref: main
          path: .repowise-host
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Record upstream revision
        run: git -C .repowise-host log -1 --format='%H %s'
      - name: Build plugin wheel and install latest host
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/plugin-dist"
          uv venv --python 3.13 "$RUNNER_TEMP/integration-venv"
          uv pip install --python "$RUNNER_TEMP/integration-venv/bin/python" \
            ./.repowise-host "$RUNNER_TEMP"/plugin-dist/*.whl "pytest>=8,<9"
      - name: Verify plugin discovery and synthetic PDF/code integration
        env:
          REPOWISE_SKIP_EDITOR_SETUP: "1"
        run: |
          "$RUNNER_TEMP/integration-venv/bin/repowise" plugins
          "$RUNNER_TEMP/integration-venv/bin/python" -m pytest \
            tests/test_extractor.py tests/test_indexing.py \
            --basetemp "$RUNNER_TEMP/synthetic-repositories" -v

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.workflow }}-${{ github.ref }}-${{ matrix.python }}
      cancel-in-progress: false
    strategy:
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --group dev --python ${{ matrix.python }}
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build
      - run: uv run python scripts/validate_release.py --dist dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions-python-${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 14
