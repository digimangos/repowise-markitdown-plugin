name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --no-project --python 3.13 python scripts/validate_release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  test:
    needs: validate
    uses: ./.github/workflows/tests.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distributions-python-3.13
          path: dist
      - run: uv run --no-project --python 3.13 python scripts/validate_release.py --tag "$RELEASE_TAG" --dist dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish verified assets and generated release notes
        run: uv run --no-project --python 3.13 python scripts/publish_release.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
